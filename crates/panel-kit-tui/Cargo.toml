[package]
name = "panel-kit-tui"
version = "1.2.0"
edition = "2021"
license = "MIT"
description = "Ratatui shell for panel-kit-core: floating/tiling panel workspaces with mouse drag/resize, traffic lights, and a dock — in the terminal (and via ratzilla, the browser)"
repository = "https://github.com/ocasazza/panel-kit"
keywords = ["tui", "ratatui", "panels", "workspace"]
categories = ["command-line-interface"]
# workspace_canary.rs is a shared module included by the examples (via
# `mod workspace_canary;`), not an example target of its own — disable
# autodiscovery and declare the real examples explicitly.
autoexamples = false


[features]
default = []
spec-plan = ["panel-kit-core/spec-json"]

[dependencies]
panel-kit-core = { version = "1.2.0", path = "../panel-kit-core" }
ratatui = { version = "0.30.1", default-features = false, features = ["all-widgets", "layout-cache"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
crossterm = "0.29"

[target.'cfg(target_arch = "wasm32")'.dependencies]
ratzilla = "0.3.1"

[dev-dependencies]
console_error_panic_hook = "0.1"
critical-section = { version = "1.2", features = ["std"] }
ratzilla = "0.3.1"
# Topos/grammar demo façade included by the topos examples.
panel-kit-grammar = { version = "1.2.0", path = "../panel-kit-grammar" }
# Layout solvers behind the `graph` component contract
# (examples/support/graph_layout.rs): vendor/jump-cannon/VENDORED.md.
graph-layouts = { path = "../../vendor/jump-cannon/graph-layouts" }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
crossterm = "0.29"
ratatui = { version = "0.30.1", features = ["crossterm"] }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
# graph-layouts solves through wgpu, whose API types are neither `Send` nor
# `Sync` on wasm without atomics unless this feature is on. `panel-kit` picks
# it up transitively through jump-cannon-graph-view; the TUI crate has no
# renderer, so it declares the feature itself.
wgpu = { version = "23", default-features = false, features = ["fragile-send-sync-non-atomic-wasm"] }

[[example]]
name = "workspace"

[[example]]
name = "browser_tui"

[[example]]
name = "trio"
required-features = ["spec-plan"]

[[example]]
name = "browser_trio"
required-features = ["spec-plan"]

[[example]]
name = "okf"
required-features = ["spec-plan"]

[[example]]
name = "browser_okf"
required-features = ["spec-plan"]
