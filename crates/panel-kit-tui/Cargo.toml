[package]
name = "panel-kit-tui"
version = "1.2.0"
edition = "2021"
license = "MIT"
description = "Ratatui shell for panel-kit-core: floating/tiling panel workspaces with mouse drag/resize, traffic lights, and a dock — in the terminal (and via ratzilla, the browser)"
repository = "https://github.com/ocasazza/panel-kit"
keywords = ["tui", "ratatui", "panels", "workspace"]
categories = ["command-line-interface"]


[features]
default = []
spec-plan = ["panel-kit-core/spec-json"]

[dependencies]
panel-kit-core = { version = "1.2.0", path = "../panel-kit-core" }
ratatui = { version = "0.30.1", default-features = false, features = ["all-widgets", "layout-cache"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
crossterm = "0.29"

[target.'cfg(target_arch = "wasm32")'.dependencies]
ratzilla = "0.3.1"

# The demos that drive this crate live in the workspace root's examples/; the
# canary providers they share (examples/support/workspace_canary.rs) are
# included here by the painter tests too.
[dev-dependencies]
panel-kit-graph-layout = { version = "0.1.0", path = "../panel-kit-graph-layout" }
crossterm = "0.29"
ratatui = { version = "0.30.1", features = ["crossterm"] }
