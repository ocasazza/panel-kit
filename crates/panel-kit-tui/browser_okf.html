<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
    <link data-trunk rel="rust" />
    <title>panel-kit TUI browser OKF canary</title>
    <style>
      :root {
        --bg: #0a0a0a;
        --fg: #ededed;
        --mono: ui-monospace, "SF Mono", "JetBrains Mono", "Menlo", "Consolas", monospace;
        background: var(--bg);
        color: var(--fg);
        font-family: var(--mono);
        font-size: 13px;
        cursor: default;
      }
      * {
        box-sizing: border-box;
        user-select: none;
        scrollbar-width: thin;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: var(--bg);
      }
      #panel-kit-okf {
        width: 100%;
        height: 100%;
        overflow: hidden;
        cursor: default;
        user-select: none;
      }
      #panel-kit-okf canvas {
        display: block;
        width: 100% !important;
        height: 100% !important;
        outline: none;
        cursor: default;
        user-select: none;
        background: var(--bg);
      }
    </style>
  </head>
  <body>
    <main id="panel-kit-okf" aria-label="panel-kit TUI browser OKF canary"></main>
  </body>
</html>
