[package]
name = "visual-parity"
version = "1.2.0"
edition = "2021"
publish = false
description = "Captures the workspace canary on the web and Bevy backends and gates their visual parity"

[dependencies]
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tungstenite = { version = "0.23", default-features = false, features = ["handshake"] }
