[package]
name = "panel-kit-grammar"
version = "1.2.0"
edition = "2021"
license = "MIT"
description = "Renderer-neutral site grammars and topos sheaves over panel-kit-core content models: runtime pest/json/okf import engines and declarative UI regimes"
repository = "https://github.com/ocasazza/panel-kit"
keywords = ["grammar", "pest", "site", "panels", "wasm"]
categories = ["parsing", "gui"]

[dependencies]
panel-kit-core = { version = "1.2.0", path = "../panel-kit-core", features = ["spec-json"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
pest = "=2.8.8"
pest_meta = "=2.8.8"
pest_vm = "=2.8.8"
pulldown-cmark = "0.13"
serde-saphyr = { version = "1.3.0", default-features = false, features = ["deserialize"] }

[dev-dependencies]
proptest = "1"
