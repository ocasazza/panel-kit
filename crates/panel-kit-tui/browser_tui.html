<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
    <link data-trunk rel="rust" />
    <title>panel-kit TUI browser canary</title>
    <style>
      :root {
        --color-background: #0a0a0a;
        --color-surface: #0d0d0d;
        --color-text: #ededed;
        --color-text-muted: #7a7a7a;
        --color-divider: #262626;
        --color-border: #5f5f5f;
        --color-highlight: #5ef38c;
        --mono: ui-monospace, "SF Mono", "JetBrains Mono", "Menlo", "Consolas", monospace;
        background: var(--color-background);
        color: var(--color-text);
        font-family: var(--mono);
        font-size: 13px;
        cursor: default;
      }
      * {
        box-sizing: border-box;
        user-select: none;
        scrollbar-width: thin;
        scrollbar-color: var(--color-border) transparent;
      }
      ::-webkit-scrollbar { width: 4px; height: 4px; }
      ::-webkit-scrollbar-thumb { background: var(--color-border); }
      ::-webkit-scrollbar-track { background: transparent; }
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: var(--color-background);
      }
      body {
        display: block;
        cursor: default;
      }
      #panel-kit-tui {
        width: 100%;
        height: 100%;
        overflow: hidden;
        cursor: default;
        user-select: none;
      }
      #panel-kit-tui canvas {
        display: block;
        width: 100% !important;
        height: 100% !important;
        outline: none;
        cursor: default;
        user-select: none;
        background: var(--color-background);
      }
    </style>
  </head>
  <body>
    <main id="panel-kit-tui" aria-label="panel-kit TUI browser canary"></main>
  </body>
</html>
