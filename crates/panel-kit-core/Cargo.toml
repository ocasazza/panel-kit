[package]
name = "panel-kit-core"
version = "1.1.1"
edition = "2021"
license = "MIT"
description = "Renderer-agnostic panel-workspace state machine: geometry, z-order, drag/resize math, tiling reorder, layout persistence model"
repository = "https://github.com/ocasazza/panel-kit"
keywords = ["ui", "panels", "workspace", "layout"]
categories = ["gui"]

[features]
default = []
spec-json = ["dep:serde_json"]
spec-schema = ["spec-json", "dep:schemars"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"], optional = true }
schemars = { version = "1", optional = true }

[dev-dependencies]
serde_json = { version = "1", features = ["preserve_order"] }
